services:
  product-service:
    build: ./product-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    ports:
      - "3000:3000"
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    ports:
      - "8001:8001"
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    ports:
      - "8002:8002"
    environment:
      AUTH_DB: /data/users.db
    volumes:
      - auth_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - product-service
      - cart-service
      - payment-service
      - auth-service
    restart: unless-stopped

volumes:
  auth_data:
